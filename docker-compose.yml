services:
  postgres:
    image: postgres:16
    container_name: cascade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cascade_dev
    ports:
      - "5432:5432"
    volumes:
      - cascade_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cascade_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "6379:6379"

volumes:
  cascade_pgdata:
